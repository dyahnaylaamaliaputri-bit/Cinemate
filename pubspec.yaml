name: cinemate
description: "Cinemate - Aplikasi Pemesanan Tiket Bioskop Berbasis AI"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  get: ^4.7.2

  # HTTP
  dio: ^5.8.0

  # Supabase
  supabase_flutter: ^2.8.4

  # Local storage (Modul 6 reference)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  get_storage: ^2.1.1

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Utils
  crypto: ^3.0.6
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/.env
